name: npm-stage-check

# 一次性排障/运维入口：查看/批准 npm staged 发布。用完可删，不影响 publish.yml。
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list | approve | raw | whoami'
        type: choice
        options: [list, approve, raw, whoami]
        default: list
      stage_id:
        description: 'approve 时需要：stage id'
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Whoami + token info
        if: ${{ inputs.action == 'whoami' }}
        run: |
          npx -y npm@12 whoami --registry=https://registry.npmjs.org || true
          npx -y npm@12 token list --registry=https://registry.npmjs.org --json 2>/dev/null | head -c 2000 || echo "(token list unavailable)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage list
        if: ${{ inputs.action == 'list' }}
        run: npx -y npm@12 stage list dsh-game-daily --loglevel=http
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Raw API probes
        if: ${{ inputs.action == 'raw' }}
        run: |
          echo "=== unauthenticated packument dist-tags"
          curl -sS -H 'Cache-Control: no-cache' https://registry.npmjs.org/-/package/dsh-game-daily/dist-tags; echo
          echo "=== authenticated packument (dist-tags + staged)"
          curl -sS -H "Authorization: Bearer $NODE_AUTH_TOKEN" -H 'Cache-Control: no-cache' https://registry.npmjs.org/dsh-game-daily \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('dist-tags',JSON.stringify(j['dist-tags']));console.log('versions',Object.keys(j.versions||{}).join(','));console.log('staged',JSON.stringify(j.staged||null).slice(0,500));})"
          echo "=== stage endpoints"
          for u in "https://registry.npmjs.org/-/stage?page=0&perPage=10" "https://registry.npmjs.org/-/stage?page=0&perPage=10&package=dsh-game-daily" "https://registry.npmjs.org/-/stage/dsh-game-daily"; do
            code=$(curl -sS -o /tmp/o.json -w "%{http_code}" -H "Authorization: Bearer $NODE_AUTH_TOKEN" "$u" || true)
            echo "-- $u -> $code"; head -c 400 /tmp/o.json; echo
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage approve
        if: ${{ inputs.action == 'approve' }}
        run: npx -y npm@12 stage approve "${{ inputs.stage_id }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
